<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARC Split Viewer</title>
  <style>
    :root {
      --bg: #111318;
      --panel: #1b1f29;
      --panel-2: #242a36;
      --line: #3a4151;
      --text: #eef2f8;
      --muted: #aeb8c8;
      --accent: #6ec6ff;
      --good: #9bd67f;
      --warn: #ffd166;
      --bad: #ff7b7b;
      --cell: 20px;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    main {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr;
    }

    aside {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 18px;
      overflow-y: auto;
    }

    section {
      padding: 18px;
      overflow: auto;
    }

    h1,
    h2,
    h3 {
      margin: 0;
      font-weight: 700;
      letter-spacing: 0;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 14px;
    }

    h2 {
      font-size: 16px;
      margin: 24px 0 10px;
    }

    h3 {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    p {
      color: var(--muted);
      line-height: 1.45;
      margin: 0 0 14px;
    }

    input,
    select,
    button {
      font: inherit;
    }

    input[type="file"],
    select {
      width: 100%;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px;
      margin: 8px 0;
    }

    button {
      color: #06111f;
      background: var(--accent);
      border: 0;
      border-radius: 6px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 700;
    }

    button.secondary {
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
    }

    .dropzone {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #151922;
      margin-bottom: 14px;
    }

    .dropzone.active {
      border-color: var(--accent);
    }

    .status {
      min-height: 22px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      white-space: pre-wrap;
    }

    .status.ok {
      color: var(--good);
    }

    .status.err {
      color: var(--bad);
    }

    .meta {
      display: grid;
      gap: 8px;
      margin-top: 14px;
      font-size: 13px;
    }

    .meta div {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 8px;
      align-items: start;
      border-bottom: 1px solid #2b3140;
      padding-bottom: 8px;
    }

    .meta b {
      color: var(--muted);
      font-weight: 600;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 16px;
      padding-bottom: 12px;
    }

    .tab {
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .tab.active {
      color: #06111f;
      background: var(--accent);
      border-color: var(--accent);
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .toolbar label {
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar select {
      width: auto;
      min-width: 220px;
      margin: 0;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .metric b {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .metric span {
      font-size: 20px;
      font-weight: 700;
    }

    .pair-list,
    .row-view {
      display: grid;
      gap: 16px;
    }

    .context-list {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .pair,
    .row-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    .context-list .pair {
      flex: 0 0 auto;
      max-width: none;
    }

    .grid-pair {
      display: grid;
      grid-template-columns: minmax(0, auto) minmax(0, auto);
      gap: 16px;
      align-items: start;
      justify-content: start;
      overflow-x: auto;
    }

    .grid-wrap {
      min-width: 0;
    }

    .grid-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .grid {
      display: grid;
      gap: 1px;
      width: max-content;
      background: #4b5568;
      border: 1px solid #4b5568;
    }

    .cell {
      width: var(--cell);
      height: var(--cell);
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, 0.8);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .c0 { background: #000000; }
    .c1 { background: #0074d9; }
    .c2 { background: #ff4136; }
    .c3 { background: #2ecc40; }
    .c4 { background: #ffdc00; color: #111318; }
    .c5 { background: #aaaaaa; color: #111318; }
    .c6 { background: #f012be; }
    .c7 { background: #ff851b; color: #111318; }
    .c8 { background: #7fdbff; color: #111318; }
    .c9 { background: #870c25; }

    .record-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 12px;
    }

    .chip {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 8px;
    }

    pre {
      margin: 12px 0 0;
      padding: 12px;
      max-height: 240px;
      overflow: auto;
      color: #dce6f5;
      background: #0c0e13;
      border: 1px solid #2b3140;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .empty {
      color: var(--muted);
      padding: 40px 0;
      text-align: center;
    }

    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .grid-pair {
        grid-template-columns: 1fr;
      }

      .context-list .grid-pair {
        grid-template-columns: minmax(0, auto) minmax(0, auto);
      }
    }
  </style>
</head>
<body>
  <main>
    <aside>
      <h1>ARC Split Viewer</h1>
      <p>Load a processed run folder or the individual files from one run.</p>

      <div id="dropzone" class="dropzone">
        <label for="folderInput">Processed run folder</label>
        <input id="folderInput" type="file" webkitdirectory multiple>
        <label for="fileInput">Individual files</label>
        <input id="fileInput" type="file" multiple>
        <button id="clearButton" class="secondary" type="button">Clear</button>
        <div id="status" class="status">Waiting for files.</div>
      </div>

      <h2>Run</h2>
      <div id="meta" class="meta"></div>
    </aside>

    <section>
      <div class="tabs">
        <button class="tab active" type="button" data-tab="split">Split</button>
        <button class="tab" type="button" data-tab="training">Training</button>
        <button class="tab" type="button" data-tab="test">Test</button>
        <button class="tab" type="button" data-tab="raw">Raw</button>
      </div>

      <div id="content" class="content">
        <div class="empty">Choose the files from a processed run to start.</div>
      </div>
    </section>
  </main>

  <script>
    const state = {
      manifest: null,
      taskSplit: null,
      training: [],
      test: [],
      activeTab: "split",
    };

    const statusEl = document.getElementById("status");
    const metaEl = document.getElementById("meta");
    const contentEl = document.getElementById("content");
    const folderInput = document.getElementById("folderInput");
    const fileInput = document.getElementById("fileInput");
    const dropzone = document.getElementById("dropzone");

    function setStatus(message, kind = "") {
      statusEl.className = `status ${kind}`;
      statusEl.textContent = message;
    }

    function parseJsonl(text, fileName) {
      return text
        .split(/\r?\n/)
        .filter((line) => line.trim())
        .map((line, index) => {
          try {
            return JSON.parse(line);
          } catch (error) {
            throw new Error(`${fileName} line ${index + 1}: ${error.message}`);
          }
        });
    }

    function normalizeName(file) {
      return (file.webkitRelativePath || file.name).toLowerCase();
    }

    function classifyFile(file) {
      const name = normalizeName(file);
      if (name.endsWith("manifest.json")) return "manifest";
      if (name.includes("task_split") && name.endsWith(".json")) return "taskSplit";
      if (name.includes("ttt_train") && name.endsWith(".jsonl")) return "training";
      if (name.includes("test") && name.endsWith(".jsonl")) return "test";
      return null;
    }

    async function readFiles(files) {
      const found = {};
      for (const file of Array.from(files)) {
        const kind = classifyFile(file);
        if (!kind || found[kind]) continue;
        const text = await file.text();
        found[kind] = { file, text };
      }

      state.manifest = found.manifest ? JSON.parse(found.manifest.text) : null;
      state.taskSplit = found.taskSplit ? JSON.parse(found.taskSplit.text) : null;
      state.training = found.training ? parseJsonl(found.training.text, found.training.file.name) : [];
      state.test = found.test ? parseJsonl(found.test.text, found.test.file.name) : [];

      const loaded = [
        state.manifest && "manifest",
        state.taskSplit && "task_split",
        state.training.length && `training ${state.training.length}`,
        state.test.length && `test ${state.test.length}`,
      ].filter(Boolean);

      if (!loaded.length) {
        throw new Error("No recognized split files found.");
      }

      setStatus(`Loaded: ${loaded.join(", ")}`, "ok");
      render();
    }

    function gridSize(grid) {
      if (!Array.isArray(grid) || !grid.length) return "0 x 0";
      return `${grid.length} x ${grid[0].length}`;
    }

    function renderGrid(grid) {
      if (!Array.isArray(grid) || !Array.isArray(grid[0])) {
        return `<div class="empty">No grid</div>`;
      }

      const cols = grid[0].length;
      const cells = grid.flatMap((row) =>
        row.map((value) => `<div class="cell c${Number(value)}">${value}</div>`)
      ).join("");

      return `<div class="grid" style="grid-template-columns: repeat(${cols}, var(--cell));">${cells}</div>`;
    }

    function renderGridPair(input, output) {
      return `
        <div class="grid-pair">
          <div class="grid-wrap">
            <div class="grid-label">Input ${gridSize(input)}</div>
            ${renderGrid(input)}
          </div>
          <div class="grid-wrap">
            <div class="grid-label">Output ${gridSize(output)}</div>
            ${renderGrid(output)}
          </div>
        </div>
      `;
    }

    function htmlEscape(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function parseTargetGrid(record) {
      if (!record || record.expected_output) return record?.expected_output;
      if (!record.target) return null;
      try {
        const parsed = JSON.parse(record.target);
        return parsed.output || null;
      } catch {
        return null;
      }
    }

    function extractQueryGrid(prompt) {
      const marker = "Query input:";
      const idx = prompt.indexOf(marker);
      if (idx < 0) return null;
      const after = prompt.slice(idx + marker.length);
      const start = after.indexOf("[");
      if (start < 0) return null;

      let depth = 0;
      for (let i = start; i < after.length; i += 1) {
        if (after[i] === "[") depth += 1;
        if (after[i] === "]") depth -= 1;
        if (depth === 0) {
          try {
            return JSON.parse(after.slice(start, i + 1));
          } catch {
            return null;
          }
        }
      }
      return null;
    }

    function renderMeta() {
      const manifest = state.manifest || {};
      const rows = [
        ["task_id", manifest.task_id],
        ["run_id", manifest.run_id],
        ["split", manifest.dataset_split],
        ["generated_ttt_rows", manifest.generated_ttt_rows],
        ["train_rows", manifest.train_rows],
        ["was_capped", String(manifest.was_capped ?? "")],
        ["test_rows", manifest.test_rows],
        ["k", manifest.k_train_examples],
        ["LOO", String(manifest.enable_loo ?? "")],
        ["train TF", String(manifest.enable_train_transforms ?? "")],
        ["test TF", String(manifest.enable_test_transforms ?? "")],
        ["permutations", manifest.num_demo_permutations],
        ["seed", manifest.seed],
      ].filter(([, value]) => value !== undefined && value !== "");

      metaEl.innerHTML = rows.length
        ? rows.map(([key, value]) => `<div><b>${key}</b><span>${htmlEscape(value)}</span></div>`).join("")
        : `<p>No manifest loaded.</p>`;
    }

    function renderSummary() {
      const manifest = state.manifest || {};
      return `
        <div class="summary">
          <div class="metric"><b>Generated TTT</b><span>${manifest.generated_ttt_rows ?? "-"}</span></div>
          <div class="metric"><b>Training</b><span>${manifest.train_rows ?? state.training.length}</span></div>
          <div class="metric"><b>Capped</b><span>${manifest.was_capped ?? "-"}</span></div>
          <div class="metric"><b>Test</b><span>${manifest.test_rows ?? state.test.length}</span></div>
          <div class="metric"><b>k demos</b><span>${manifest.k_train_examples ?? "-"}</span></div>
        </div>
      `;
    }

    function renderSplit() {
      if (!state.taskSplit) return `<div class="empty">Load task_split.json to view selected demos.</div>`;
      const demos = state.taskSplit.selected_demos || [];
      const tests = state.taskSplit.test_pairs || [];
      const demoHtml = demos.map((pair, index) => `
        <div class="pair">
          <h3>Selected demo ${index} / original index ${state.taskSplit.selected_demo_indices?.[index] ?? index}</h3>
          ${renderGridPair(pair.input, pair.output)}
        </div>
      `).join("");
      const testHtml = tests.map((pair, index) => `
        <div class="pair">
          <h3>Held-out test ${index}</h3>
          ${renderGridPair(pair.input, pair.output)}
        </div>
      `).join("");

      return `
        ${renderSummary()}
        <h2>Selected Demos</h2>
        <div class="pair-list">${demoHtml}</div>
        <h2>Test Pairs</h2>
        <div class="pair-list">${testHtml}</div>
      `;
    }

    function renderRows(records, title) {
      if (!records.length) return `<div class="empty">No ${title.toLowerCase()} rows loaded.</div>`;
      const options = records.map((record, index) => {
        const contextCount = Array.isArray(record.context_pairs) ? record.context_pairs.length : 0;
        const label = [
          `#${index}`,
          record.mode,
          record.transform,
          contextCount ? `${contextCount} context` : "",
          record.heldout_demo_index !== undefined ? `heldout ${record.heldout_demo_index}` : "",
        ].filter(Boolean).join(" | ");
        return `<option value="${index}">${htmlEscape(label)}</option>`;
      }).join("");

      return `
        <div class="toolbar">
          <label for="rowSelect">${title} row</label>
          <select id="rowSelect">${options}</select>
        </div>
        <div id="rowDetail"></div>
      `;
    }

    function renderContextPairs(pairs) {
      if (!Array.isArray(pairs) || !pairs.length) return "";

      const pairHtml = pairs.map((pair, index) => `
        <div class="pair">
          <h3>Prompt context ${index}</h3>
          ${renderGridPair(pair.input, pair.output)}
        </div>
      `).join("");

      return `
        <h2>Prompt Context Pairs (${pairs.length})</h2>
        <div class="context-list">${pairHtml}</div>
      `;
    }

    function renderOneRow(record, index) {
      const queryGrid = record.query_input || extractQueryGrid(record.prompt || "");
      const targetGrid = record.target_output || parseTargetGrid(record);
      const meta = [
        `row ${index}`,
        record.mode && `mode ${record.mode}`,
        record.transform && `transform ${record.transform}`,
        record.inverse_transform && `inverse ${record.inverse_transform}`,
        record.heldout_demo_index !== undefined && `heldout ${record.heldout_demo_index}`,
        record.context_demo_indices && `context [${record.context_demo_indices.join(", ")}]`,
      ].filter(Boolean);

      return `
        <div class="row-card">
          <div class="record-meta">${meta.map((item) => `<span class="chip">${htmlEscape(item)}</span>`).join("")}</div>
          ${renderContextPairs(record.context_pairs)}
          <h2>Query And Target</h2>
          ${renderGridPair(queryGrid, targetGrid)}
          <h2>Prompt Text</h2>
          <pre>${htmlEscape(record.prompt || "")}</pre>
        </div>
      `;
    }

    function attachRowSelect(records) {
      const select = document.getElementById("rowSelect");
      const detail = document.getElementById("rowDetail");
      if (!select || !detail) return;

      const update = () => {
        const index = Number(select.value);
        detail.innerHTML = renderOneRow(records[index], index);
      };

      select.addEventListener("change", update);
      update();
    }

    function renderRaw() {
      return `
        <h2>Manifest</h2>
        <pre>${htmlEscape(JSON.stringify(state.manifest || {}, null, 2))}</pre>
        <h2>Task Split</h2>
        <pre>${htmlEscape(JSON.stringify(state.taskSplit || {}, null, 2))}</pre>
      `;
    }

    function render() {
      renderMeta();

      const tab = state.activeTab;
      if (tab === "split") contentEl.innerHTML = renderSplit();
      if (tab === "training") contentEl.innerHTML = renderRows(state.training, "Training");
      if (tab === "test") contentEl.innerHTML = renderRows(state.test, "Test");
      if (tab === "raw") contentEl.innerHTML = renderRaw();

      if (tab === "training") attachRowSelect(state.training);
      if (tab === "test") attachRowSelect(state.test);
    }

    function clearState() {
      state.manifest = null;
      state.taskSplit = null;
      state.training = [];
      state.test = [];
      metaEl.innerHTML = "";
      contentEl.innerHTML = `<div class="empty">Choose the files from a processed run to start.</div>`;
      folderInput.value = "";
      fileInput.value = "";
      setStatus("Waiting for files.");
    }

    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        state.activeTab = button.dataset.tab;
        render();
      });
    });

    folderInput.addEventListener("change", async (event) => {
      try {
        await readFiles(event.target.files);
      } catch (error) {
        setStatus(error.message, "err");
      }
    });

    fileInput.addEventListener("change", async (event) => {
      try {
        await readFiles(event.target.files);
      } catch (error) {
        setStatus(error.message, "err");
      }
    });

    document.getElementById("clearButton").addEventListener("click", clearState);

    dropzone.addEventListener("dragover", (event) => {
      event.preventDefault();
      dropzone.classList.add("active");
    });

    dropzone.addEventListener("dragleave", () => {
      dropzone.classList.remove("active");
    });

    dropzone.addEventListener("drop", async (event) => {
      event.preventDefault();
      dropzone.classList.remove("active");
      try {
        await readFiles(event.dataTransfer.files);
      } catch (error) {
        setStatus(error.message, "err");
      }
    });
  </script>
</body>
</html>
